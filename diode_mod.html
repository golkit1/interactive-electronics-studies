<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אפנון בדיודה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF2F5; --panel:#F9FBFC; --grid:#DCE5EC; --ink:#15223A; --muted:#566579;
  --rule:#C3CFDA; --off:#BCC8D3; --dot:#F2A900; --dot-edge:#7A5200;
  --hi:#C0263A; --lo:#2459C4; --tone:#1F8A5B; --btn-ink:#F9FBFC;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1620; --panel:#15202C; --grid:#1C2936; --ink:#E4ECF3; --muted:#93A3B5;
    --rule:#2C3B4B; --off:#34465A; --dot:#FFC233; --dot-edge:#4A3300;
    --hi:#FF6B7D; --lo:#6FA0FF; --tone:#4FD18F; --btn-ink:#0E1620;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1620; --panel:#15202C; --grid:#1C2936; --ink:#E4ECF3; --muted:#93A3B5;
  --rule:#2C3B4B; --off:#34465A; --dot:#FFC233; --dot-edge:#4A3300;
  --hi:#FF6B7D; --lo:#6FA0FF; --tone:#4FD18F; --btn-ink:#0E1620;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:"Rubik",system-ui,Arial,sans-serif; font-size:16px; line-height:1.45;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 24px}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:900;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.05;margin:0 0 2px}
.lead{margin:0 0 10px;color:var(--muted)}
.top{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:10px;align-items:start}
.side{display:grid;gap:10px}
.side .card{margin-top:0}
@media (max-width:900px){.top{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}

svg{width:100%;height:auto;display:block;direction:ltr}
.schem{overflow-x:auto}
@media (max-width:600px){.schem svg{min-width:520px}}
.w{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.w.off{stroke:var(--off)}
.lbl{fill:var(--muted);font:500 15px "Rubik",sans-serif}
.ttl{fill:var(--ink);font:700 16px "Rubik",sans-serif}
.gnd{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
#diode{fill:var(--panel);stroke:var(--ink);stroke-width:3;stroke-linejoin:round;transition:fill .08s}
#diode.open{fill:var(--dot)}
.dot{fill:var(--dot);stroke:var(--dot-edge);stroke-width:1.2}
.waves path{fill:none;stroke:var(--tone);stroke-width:3;stroke-linecap:round}


.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;align-items:end}
.controls .buttons{grid-column:1/-1}
@media (max-width:420px){.controls{grid-template-columns:1fr}}
.slider b{font-weight:500;display:block}
.slider input{width:100%;accent-color:var(--ink);margin:4px 0 0}
.ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.buttons{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:500;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--btn-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--dot);outline-offset:2px}

.scope{margin-top:10px}
canvas{width:100%;height:225px;display:block}

.capctl{}
.capctl .vin{font-weight:700}
.capctl .vin b{display:inline-block;min-width:2.6em;text-align:center;font-size:1.15rem}
.gauge{margin:1.5rem .4rem .1rem;direction:ltr}
.track{position:relative;height:16px;border-radius:8px;background:var(--paper);border:1px solid var(--rule);cursor:grab;touch-action:none}
.track:active{cursor:grabbing}
.track:focus-visible{outline:3px solid var(--dot);outline-offset:4px}
.band{position:absolute;top:0;bottom:0;background:var(--grid)}
.tick{position:absolute;top:-7px;bottom:-7px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.tick span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.8rem;color:var(--muted);direction:rtl}
.tick.hit{background:var(--dot);box-shadow:0 0 8px var(--dot)}
.tick.hit span{color:var(--ink);font-weight:700}
.ptr{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--lo);border:3px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.gends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:.2rem}
.zsay{margin-top:.3rem;font-size:.95rem}
.zsay .st{font-weight:700}
.capctl .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:.3rem}
.draghint{font-size:.85rem;color:var(--muted)}
#meter{cursor:ns-resize;touch-action:none}

</style>
</head>
<body>
<div class="wrap">
  <h1>אפנון בדיודה (Diode Modulation)</h1>
  <p class="lead">מתנד איטי מדליק ומכבה מתנד של צליל. התוצאה: ביפ־ביפ קצבי.</p>

  <div class="top">
  <section class="card">
    <div class="schem"><svg viewBox="16 14 630 280" role="img" aria-label="מעגל: מתנד איטי, דיודה, מתנד צליל ורמקול">
      <!-- slow oscillator -->
      <text class="ttl" x="140" y="34" text-anchor="middle" direction="rtl" style="unicode-bidi:embed">מתנד איטי</text>
      <path class="w" d="M90 160 V90 H115"/>
      <path class="w" d="M115 90 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l10 16 l5 -8"/>
      <path class="w" d="M120 108 L162 72" style="stroke-width:2"/><path d="M162 72 l-9 2 l5 6 z" fill="var(--ink)"/>
      <path class="w" d="M165 90 H190 V160"/>
      <path class="w" d="M90 160 H110"/>
      <path class="w" d="M110 136 V184 L152 160 Z"/>
      <path d="M121 166 h8 v-12 h7 M125 166 h7 v-12" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
      <circle cx="157" cy="160" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>
      <path class="w" d="M162 160 H190"/>
      <path class="w" d="M90 160 V203 M72 203 H108 M72 213 H108 M90 213 V262"/>
      <text class="lbl" x="98" y="240">10µF</text>
      <g id="meter" aria-hidden="true">
        <rect x="30" y="176" width="24" height="82" rx="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
        <rect id="mFill" x="32" y="216" width="20" height="40" rx="3" fill="var(--lo)" opacity=".85"/>
        <line id="mU" x1="24" x2="60" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line id="mL" x1="24" x2="60" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path d="M58 208 H72" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 3"/>
      </g>
      <text id="lvl" class="ttl" x="190" y="186" text-anchor="middle">+</text>

      <!-- diode -->
      <path id="wireAB" class="w" d="M190 160 H236"/>
      <path id="diode" d="M236 146 V174 L262 160 Z"/>
      <path id="diodeBar" class="w" d="M262 146 V174"/>
      <path id="wireBC" class="w" d="M262 160 H330"/>
      <text class="ttl" x="249" y="132" text-anchor="middle" direction="rtl" style="unicode-bidi:embed">דיודה</text>
      <g id="dots"></g>
      <g id="flow2"></g>

      <!-- tone oscillator -->
      <text class="ttl" x="380" y="34" text-anchor="middle" direction="rtl" style="unicode-bidi:embed">מתנד צליל</text>
      <path class="w" d="M330 160 V90 H355"/>
      <path class="w" d="M355 90 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l10 16 l5 -8"/>
      <path class="w" d="M360 108 L402 72" style="stroke-width:2"/><path d="M402 72 l-9 2 l5 6 z" fill="var(--ink)"/>
      <path class="w" d="M405 90 H430 V160"/>
      <path class="w" d="M330 160 H350"/>
      <path class="w" d="M350 136 V184 L392 160 Z"/>
      <path d="M361 166 h8 v-12 h7 M365 166 h7 v-12" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
      <circle cx="397" cy="160" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>
      <path class="w" d="M402 160 H430"/>
      <path class="w" d="M330 160 V203 M312 203 H348 M312 213 H348 M330 213 V262"/>
      <text class="lbl" x="338" y="240">1µF</text>
      <g aria-hidden="true">
        <rect x="270" y="176" width="24" height="82" rx="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
        <rect id="m2Fill" x="272" y="216" width="20" height="40" rx="3" fill="var(--tone)" opacity=".85"/>
        <line id="m2U" x1="264" x2="300" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line id="m2L" x1="264" x2="300" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path d="M298 208 H312" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 3"/>
      </g>

      <!-- output -->
      <path class="w" d="M430 160 H462"/>
      <path class="w" d="M462 160 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l10 16 l5 -8"/>
      <text class="lbl" x="492" y="190" text-anchor="middle">100k</text>
      <path class="w" d="M522 160 H556"/>
      <path class="w" d="M556 148 H568 V172 H556 Z M568 148 L588 132 V188 L568 172"/>
      <path class="w" d="M562 172 V262"/>
      <g id="waves" class="waves"><path d="M600 146 q8 14 0 28"/><path d="M612 138 q14 22 0 44"/></g>
      <text class="ttl" x="575" y="116" text-anchor="middle" direction="rtl" style="unicode-bidi:embed">רמקול</text>

      <!-- ground -->
      <path class="w" d="M90 262 H562"/>
      <path class="gnd" d="M326 262 V272 M312 272 H340 M317 278 H335 M322 284 H330"/>
    </svg></div>
  </section>

  <div class="side">
  <section class="card controls">
    <label class="slider"><b>קצב המתנד האיטי</b>
      <input id="sRate" type="range" min="0" max="100" value="35">
      <span class="ends"><span>איטי</span><span>מהיר</span></span></label>
    <label class="slider"><b>גובה הצליל</b>
      <input id="sPitch" type="range" min="0" max="100" value="45">
      <span class="ends"><span>נמוך</span><span>גבוה</span></span></label>
    <div class="buttons">
      <button id="bPlay" aria-pressed="false">השמעה</button>
      <button id="bPause" aria-pressed="false">השהיה</button>
      <button id="bDiode" aria-pressed="true">דיודה מחוברת</button>
    </div>
  </section>

  <section class="card capctl">
    <div class="vin">המתח על הקבל של המתנד האיטי: <b id="vNum">0.0</b> וולט</div>
    <div class="gauge">
      <div class="track" id="gTrack" tabindex="0" role="slider" aria-label="המתח על הקבל של המתנד האיטי" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0">
        <div class="band" id="gBand"></div>
        <div class="tick" id="tL"><span>רף תחתון</span></div><div class="tick" id="tU"><span>רף עליון</span></div>
        <div class="ptr" id="gPtr"></div>
      </div>
      <div class="gends"><span>0</span><span>9</span></div>
    </div>
    <div class="zsay" id="zSay"></div>
    <div class="row">
      <span class="draghint">גררו את הנקודה, או את המים במד הכחול.</span>
      <button id="bAuto" aria-pressed="true">הפעלה רציפה</button>
    </div>
  </section>
  </div>
  </div>

  <section class="card scope">
    <canvas id="cv" aria-label="גרף: המתח במתנד האיטי וביציאה"></canvas>
  </section>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const st = { rate: 2, pitch: 400, diode: true, high: true, paused: false, v: 0.38, manual: false, v2: 0.38, o2: true };
  const U = 0.62, L = 0.38, VCC = 9, KA = 2 * Math.log((1 - L) / (1 - U));  // k = KA * rate gives one full cycle per 1/rate seconds
  const rateOf = v => 0.5 * Math.pow(16, v / 100);      // 0.5 .. 8 Hz
  const pitchOf = v => 120 * Math.pow(10, v / 100);     // 120 .. 1200 Hz

  // current dots: osc1 output -> diode -> osc2 input
  const N = 6, dots = [];
  for (let k = 0; k < N; k++) { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 4); c.setAttribute('class', 'dot'); c.setAttribute('cy', 160); $('dots').appendChild(c); dots.push(c); }
  let dotOff = 0;

  // current arrows in the tone oscillator: output -> potentiometer -> capacitor, and back
  const flow2 = (() => {
    const g = $('flow2'), pth = document.createElementNS(NS, 'path');
    pth.setAttribute('d', 'M404 160 H430 V90 H330 V196'); pth.setAttribute('fill', 'none'); pth.setAttribute('stroke', 'none');
    g.appendChild(pth);
    const len = pth.getTotalLength(), n = Math.floor(len / 34), arr = [];
    for (let i = 0; i < n; i++) {
      const a = document.createElementNS(NS, 'polygon');
      a.setAttribute('points', '-7,-6 7,0 -7,6'); a.setAttribute('fill', 'var(--tone)');
      g.appendChild(a); arr.push(a);
    }
    return { pth, len, sp: len / n, arr, off: 0 };
  })();
  function drawFlow2(dir, show) {
    const f = flow2;
    f.arr.forEach((a, i) => {
      if (!show) { a.style.display = 'none'; return; }
      a.style.display = '';
      const d = ((i * f.sp + f.off) % f.len + f.len) % f.len;
      const p1 = f.pth.getPointAtLength(d), p2 = f.pth.getPointAtLength(Math.min(f.len, d + 1)), p0 = f.pth.getPointAtLength(Math.max(0, d - 1));
      let ang = Math.atan2(p2.y - p0.y, p2.x - p0.x) * 180 / Math.PI; if (dir < 0) ang += 180;
      a.setAttribute('transform', 'translate(' + p1.x + ' ' + p1.y + ') rotate(' + ang + ')');
    });
  }

  // audio
  let ac = null, nodes = null;
  function startAudio() {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + 0.02;
    const tone = ac.createOscillator(); tone.type = 'square'; tone.frequency.value = st.pitch;
    const gate = ac.createGain(); gate.gain.value = 0;
    const master = ac.createGain(); master.gain.value = 0.12;
    tone.connect(gate).connect(master).connect(ac.destination);
    tone.start(t);
    nodes = { tone, gate, master, last: t, sounding: null };
  }
  function stopAudio() {
    if (!nodes) return;
    const t = ac.currentTime;
    nodes.master.gain.setTargetAtTime(0, t, 0.01);
    const n = nodes; nodes = null;
    setTimeout(() => { try { n.tone.stop(); } catch (e) {} }, 120);
  }
  function setDiode(on) {
    st.diode = on;
    $('bDiode').setAttribute('aria-pressed', on);
    $('bDiode').textContent = on ? 'דיודה מחוברת' : 'דיודה מנותקת';
    ['wireAB', 'diodeBar', 'wireBC'].forEach(id => $(id).classList.toggle('off', !on));
    $('diode').style.stroke = on ? '' : css('--off');
  }

  $('bPlay').onclick = () => {
    const playing = $('bPlay').getAttribute('aria-pressed') === 'true';
    if (playing) { stopAudio(); $('bPlay').setAttribute('aria-pressed', 'false'); $('bPlay').textContent = 'השמעה'; }
    else { if (st.paused) setPaused(false); startAudio(); $('bPlay').setAttribute('aria-pressed', 'true'); $('bPlay').textContent = 'עצירה'; }
  };
  $('bDiode').onclick = () => setDiode(!st.diode);
  function setPaused(p) {
    st.paused = p;
    $('bPause').setAttribute('aria-pressed', p);
    $('bPause').textContent = p ? 'המשך' : 'השהיה';
    if (ac) { if (p) ac.suspend(); else ac.resume(); }
  }
  $('bPause').onclick = () => setPaused(!st.paused);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !/^(BUTTON|INPUT)$/.test(e.target.tagName)) { e.preventDefault(); setPaused(!st.paused); }
  });
  function readSliders() {
    st.rate = rateOf(+$('sRate').value); st.pitch = pitchOf(+$('sPitch').value);
    if (nodes) {
      nodes.tone.frequency.setTargetAtTime(st.pitch, ac.currentTime, 0.01);
    }
  }
  function setManual(on) {
    st.manual = on; $('bAuto').setAttribute('aria-pressed', !on);
    if (on && st.paused) setPaused(false);
  }
  function setV(v) {
    setManual(true); st.v = Math.max(0, Math.min(1, v));
    if (st.v >= U) st.high = false; else if (st.v <= L) st.high = true;
  }
  $('bAuto').onclick = () => setManual(false);
  function dragOn(el, fn) {
    el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); fn(e); e.preventDefault(); });
    el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) fn(e); });
  }
  const gTrack = $('gTrack');
  dragOn(gTrack, e => { const r = gTrack.getBoundingClientRect(); setV((e.clientX - r.left) / r.width); });
  const MY = 178, MH = 78;   // meter inner top and height in svg units
  dragOn($('meter'), e => {
    const svg = $('meter').ownerSVGElement, pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse()); setV((MY + MH - p.y) / MH);
  });
  gTrack.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (d) { e.preventDefault(); setV(st.v + d * 0.02); }
  });
  $('gBand').style.left = (L * 100) + '%'; $('gBand').style.width = ((U - L) * 100) + '%';
  $('tL').style.left = (L * 100) + '%'; $('tU').style.left = (U * 100) + '%';
  const mY = v => MY + MH * (1 - v);
  ['mU', 'mL'].forEach((id, k) => { const y = mY(k ? L : U); $(id).setAttribute('y1', y); $(id).setAttribute('y2', y); });
  ['m2U', 'm2L'].forEach((id, k) => { const y = mY(k ? L : U); $(id).setAttribute('y1', y); $(id).setAttribute('y2', y); });
  let lastHigh = st.high, flipAge = 9, lastSay = '';
  const WHERE = { flipL: 'נגע ברף התחתון: השער מתהפך.', flipU: 'נגע ברף העליון: השער מתהפך.',
    below: 'מתחת לרף התחתון.', above: 'מעל הרף העליון.', between: 'בין הרפים: השער לא מתהפך.' };
  const RES = { off: 'הדיודה מנותקת, אז מתנד הצליל רץ רגיל כל הזמן.',
    held: 'הדיודה מוליכה וממלאת את הקבל של מתנד הצליל. השער שלו רואה 1, והיציאה שלו תקועה על נמוך, אז אין צליל.',
    drain: 'הדיודה לא מוליכה. הקבל של מתנד הצליל עוד מתרוקן, ועוד רגע הצליל מתחיל.',
    run: 'הדיודה לא מוליכה, ומתנד הצליל רץ רגיל.' };
  function sayText(w, high, r) {
    return WHERE[w] + ' המתנד האיטי ביציאה: <span class="st" style="color:' + (high ? css('--hi') : css('--lo')) + '">' +
      (high ? 'גבוה' : 'נמוך') + '</span>. ' + RES[r];
  }
  // reserve room for the longest message, so the layout below never jumps
  function fitSay() {
    const z = $('zSay'), keep = z.innerHTML; z.style.minHeight = '0px'; let mx = 0;
    for (const w in WHERE) for (const h of [true, false]) for (const r in RES) { z.innerHTML = sayText(w, h, r); mx = Math.max(mx, z.offsetHeight); }
    z.innerHTML = keep; z.style.minHeight = mx + 'px';
  }
  new ResizeObserver(fitSay).observe($('zSay').parentElement);
  if (document.fonts) document.fonts.ready.then(fitSay);

  $('sRate').addEventListener('input', readSliders);
  $('sPitch').addEventListener('input', readSliders);
  readSliders();

  // scope
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0;
  new ResizeObserver(() => {
    const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }).observe(cv);
  const hist = []; const WINDOW = 3;   // seconds shown

  let wall = 0, lastPerf = performance.now(), tonePhase = 0;
  function frame(now) {
    let dt;
    if (nodes) { const t = ac.currentTime; dt = Math.max(0, t - nodes.last); nodes.last = t; }
    else { dt = Math.min(0.05, (now - lastPerf) / 1000); }
    if (st.paused && !st.manual) dt = 0;
    lastPerf = now; wall += dt;
    if (!st.manual && dt > 0) {
      const k = KA * st.rate;
      if (st.high) { st.v = 1 - (1 - st.v) * Math.exp(-k * dt); if (st.v >= U) st.high = false; }
      else { st.v = st.v * Math.exp(-k * dt); if (st.v <= L) st.high = true; }
    }
    const open = st.diode && st.high;
    const sounding = !open;
    {
      const k2 = KA * st.pitch / 40, kd = 30;      // slow motion: 3..30 cycles per second on screen
      if (open) st.v2 = 1 - (1 - st.v2) * Math.exp(-kd * dt);
      else if (st.o2) st.v2 = 1 - (1 - st.v2) * Math.exp(-k2 * dt);
      else st.v2 = st.v2 * Math.exp(-k2 * dt);
      if (st.v2 >= U) st.o2 = false; else if (st.v2 <= L) st.o2 = true;
    }
    $('m2Fill').setAttribute('y', mY(st.v2)); $('m2Fill').setAttribute('height', Math.max(0, MY + MH - mY(st.v2)));
    {
      const dir = st.o2 ? 1 : -1, cur = st.o2 ? (1 - st.v2) : st.v2;
      flow2.off += dt * 110 * cur * dir;
      drawFlow2(dir, !open);
    }
    if (nodes && nodes.sounding !== sounding) { nodes.gate.gain.setTargetAtTime(sounding ? 1 : 0, ac.currentTime, 0.003); nodes.sounding = sounding; }
    if (st.high !== lastHigh) { flipAge = 0; lastHigh = st.high; } else flipAge += Math.max(dt, st.manual ? 1 / 60 : 0);

    // capacitor readouts
    $('vNum').textContent = (st.v * VCC).toFixed(1);
    $('gPtr').style.left = (st.v * 100) + '%';
    gTrack.setAttribute('aria-valuenow', (st.v * VCC).toFixed(1));
    $('mFill').setAttribute('y', mY(st.v)); $('mFill').setAttribute('height', Math.max(0, MY + MH - mY(st.v)));
    const flash = flipAge < (st.manual ? 1 : Math.min(0.6, 0.25 / st.rate));
    $('tU').classList.toggle('hit', flash && !st.high); $('tL').classList.toggle('hit', flash && st.high);
    const whereK = flash ? (st.high ? 'flipL' : 'flipU') : st.v < L ? 'below' : st.v > U ? 'above' : 'between';
    const resK = !st.diode ? 'off' : st.high ? 'held' : st.v2 > U ? 'drain' : 'run';
    const key = whereK + st.high + resK;
    if (key !== lastSay) { lastSay = key; $('zSay').innerHTML = sayText(whereK, st.high, resK); }

    // history for the scope (sample every frame)
    if (dt > 0) hist.push({ t: wall, cap: st.v, lfo: st.high ? 1 : 0, cap2: st.v2, out: st.o2 ? 1 : 0, on: sounding });
    while (hist.length && hist[0].t < wall - WINDOW - 0.5) hist.shift();

    // circuit state
    $('diode').classList.toggle('open', open);
    $('lvl').textContent = st.high ? 'גבוה' : 'נמוך';
    $('lvl').style.fill = st.high ? css('--hi') : css('--lo');
    $('waves').style.visibility = sounding ? 'visible' : 'hidden';
    dotOff = (dotOff + 90 * dt) % 140;
    dots.forEach((d, k) => {
      const x = 190 + ((dotOff + k * (140 / N)) % 140);
      d.setAttribute('cx', x);
      d.style.visibility = open && (x < 232 || x > 268) ? 'visible' : 'hidden';
    });

    draw();
    requestAnimationFrame(frame);
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);
    const PL = 8, R = 8, pw = W - PL - R;
    const band = H / 4, rh = band - 22;
    const rows = [{ key: 'cap', label: 'המתח על הקבל של המתנד האיטי', color: css('--lo'), top: 18 },
                  { key: 'lfo', label: 'יציאת המתנד האיטי', color: css('--hi'), top: 18 + band },
                  { key: 'cap2', label: 'המתח על הקבל של מתנד הצליל (בהילוך איטי)', color: css('--tone'), top: 18 + 2 * band },
                  { key: 'out', label: 'יציאת מתנד הצליל לרמקול (בהילוך איטי)', color: css('--tone'), top: 18 + 3 * band }];
    ctx.font = '12px Rubik, sans-serif'; ctx.textBaseline = 'bottom'; ctx.textAlign = 'right';
    for (const r of rows) {
      ctx.fillStyle = css('--muted'); ctx.fillText(r.label, W - R, r.top - 4);
      ctx.strokeStyle = css('--rule'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PL, r.top + rh); ctx.lineTo(PL + pw, r.top + rh); ctx.stroke();
      if (r.key === 'cap' || r.key === 'cap2') {
        ctx.setLineDash([6, 5]); ctx.strokeStyle = css('--muted');
        [U, L].forEach(v => { const y = r.top + rh - v * rh; ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(PL + pw, y); ctx.stroke(); });
        ctx.setLineDash([]);
      }
      ctx.strokeStyle = r.color; ctx.lineWidth = 2.5; ctx.beginPath();
      let first = true, prevY = null;
      for (const h of hist) {
        const x = PL + pw - (wall - h.t) / WINDOW * pw; if (x < PL) continue;
        const y = r.top + rh - h[r.key] * rh;
        if (first) { ctx.moveTo(x, y); first = false; }
        else { if (prevY !== y && r.key !== 'cap' && r.key !== 'cap2') ctx.lineTo(x, prevY); ctx.lineTo(x, y); }
        prevY = y;
      }
      ctx.stroke();
    }
  }

  setDiode(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
